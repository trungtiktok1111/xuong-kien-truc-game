<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Xưởng Kiến Trúc Võ Lâm</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e141b;color:#e8edf3;font:14px -apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#bar{flex:none;display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;background:#17202a;border-bottom:1px solid #2b3846}
#bar{overflow-x:auto}#bar h1{min-width:0;margin:0;font-size:15px;color:#e8c25a;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbtn{white-space:nowrap;border:0;border-radius:16px;padding:8px 10px;background:#263342;color:#cfd8e2;font-size:14px;font-weight:600}.tabbtn.on{background:#e0b050;color:#2a1a08}
.view{flex:1;min-height:0;display:none;flex-direction:column}
canvas.main{flex:1;min-height:0;min-width:0;width:100%;display:block;touch-action:none;background:#10161d}
.panel{flex:none;height:44%;display:flex;flex-direction:column;background:#17202a;border-top:1px solid #2b3846}
.ptabs{flex:none;display:flex;flex-wrap:wrap;gap:4px;padding:6px 6px 0}
.ptab{flex:none;border:0;border-radius:10px;padding:8px 11px;background:#202c38;color:#b9c4d0;font-size:13px}.ptab.on{background:#2f4156;color:#fff;font-weight:600}
.pbody{flex:1;overflow:auto;padding:8px;-webkit-overflow-scrolling:touch;touch-action:pan-y pan-x}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.b{border:0;border-radius:9px;padding:9px 11px;background:#2b3a4b;color:#e1e8f0;font-size:13px}.b.on{background:#3f78c9;color:#fff}.b.off{opacity:.55}.b.ghost{background:none;color:#9fb0c2;padding:0}
.lbl{color:#9fb0c2;font-size:12px}.hint{color:#8fa0b2;font-size:12px;line-height:1.45;margin:4px 0}
.stampc{background:#2a3340;border:1px solid #3a4a5c;image-rendering:pixelated;max-width:140px;max-height:100px}
.sheetwrap{overflow:auto;max-height:260px;border:1px solid #2f4156;margin-bottom:8px;touch-action:pan-x pan-y}.sheetwrap canvas{display:block;image-rendering:pixelated}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.libitem{background:#202c38;border-radius:10px;padding:8px;font-size:12px}.libitem canvas{image-rendering:pixelated;max-width:100%}
.num{width:64px;padding:8px;border-radius:8px;border:1px solid #3a4a5c;background:#202c38;color:#fff;font-size:14px}
.shp{border:2px solid transparent;border-radius:10px;background:#202c38;color:#cfd8e2;font-size:11px;padding:4px;display:flex;flex-direction:column;align-items:center}.shp.on{border-color:#ffd24a}
.matgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-bottom:8px}
.mat{border:2px solid transparent;border-radius:10px;background:#202c38;color:#cfd8e2;font-size:11px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px}.mat.on{border-color:#ffd24a}.matimg{width:40px;height:40px;image-rendering:pixelated;border-radius:6px}
.sl{flex:1;min-width:120px}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:18px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:90%;text-align:center}
@media (min-aspect-ratio:1/1) and (min-width:760px){.view{flex-direction:row}.panel{height:auto;width:380px;border-top:0;border-left:1px solid #2b3846}}
@media(max-width:560px){#bar h1{display:none}#bar .tabbtn{flex:1}}
</style></head><body><div id="app">
<div id="bar"><h1>Xưởng Kiến Trúc Võ Lâm</h1><button class="tabbtn" data-v="2d">🗺 2D</button><button class="tabbtn" data-v="3d">🧱 3D</button><button id="playbtn" class="tabbtn" style="background:#2e8b57;color:#fff">🎮 Chơi</button><button id="chkbtn" class="tabbtn" style="background:#3a6ea5;color:#fff">✅ Kiểm</button><button id="relbtn" class="tabbtn" style="background:#b8742a;color:#fff">🚀 Xuất</button></div>
<div id="v2d" class="view"><canvas id="cv2" class="main"></canvas><div id="pn2" class="panel"></div></div>
<div id="v3d" class="view"><canvas id="cv3" class="main"></canvas><div id="pn3" class="panel"></div></div>
</div>
<script>__JS__</script></body></html>
